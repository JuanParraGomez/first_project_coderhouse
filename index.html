<!DOCTYPE html>
<html lang="es" data-theme="light"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer type="module" src="script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Champion VS</title>
    <style>
        /* Personalización de colores específicos */
        .border-blue-custom { border-color: #0070f3; }
        .border-yellow-custom { border-color: #facc15; }
        .text-blue-custom { color: #0070f3; }
        .text-yellow-custom { color: #facc15; }
    </style>
</head>
<body class="bg-white min-h-screen p-8 text-slate-800">

    <header class="text-center mb-10">
        <h1 class="text-4xl font-black text-blue-custom uppercase tracking-widest">Champions VS</h1>
        <p class="text-slate-400 font-bold">Compara a tus campeones</p>
    </header>

    <div class="flex flex-col lg:flex-row items-start justify-center gap-8">
        
        <div id="card1" class="flex flex-col gap-4 items-center bg-white p-6 rounded-2xl shadow-lg border-2 border-blue-custom w-96 min-h-[550px]">
            <div class="flex flex-col gap-2 w-full">
                <select id="rol1" class="select border-blue-custom focus:border-blue-custom w-full bg-white"></select>
                <select id="cham1" class="select border-blue-custom focus:border-blue-custom w-full bg-white"></select>
            </div>
            
            <div id="cham1rol1" class="w-full"></div>
        </div>

        <div class="flex flex-col items-center justify-center self-center gap-4">
            <div class="text-7xl font-black italic text-blue-custom opacity-30">VS</div>
            <button id="btnComparar" class="btn bg-blue-custom text-white font-bold text-lg hover:opacity-80 border-none" disabled>⚔️ Comparar</button>
            <div class="divider lg:divider-horizontal before:bg-blue-custom after:bg-blue-custom"></div> 
        </div>

        <div id="card2" class="flex flex-col gap-4 items-center bg-white p-6 rounded-2xl shadow-lg border-2 border-blue-custom w-96 min-h-[550px]">
            <div class="flex flex-col gap-2 w-full">
                <select id="rol2" class="select border-blue-custom w-full bg-white"></select>
                <select id="cham2" class="select border-blue-custom w-full bg-white"></select>
            </div>
            <div id="cham2rol2" class="w-full"></div>
        </div>

    </div>

    <div id="resultadoComparacion" class="max-w-4xl mx-auto mt-10"></div>

    <div class="max-w-4xl mx-auto mt-10">
        <h2 class="text-2xl font-bold text-blue-custom mb-4">📜 Historial de comparaciones</h2>
        <div id="historial" class="flex flex-wrap gap-4"></div>
    </div>

    <footer class="text-center mt-16 mb-8 text-slate-400 text-sm">
        <p>Champions VS — Proyecto Final</p>
    </footer>

</body>
</html>
